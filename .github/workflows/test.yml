name: LogShield CI Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install lightweight deps
      run: |
        python -m pip install --upgrade pip
        python -m pip install pandas numpy scikit-learn pytest plotly watchdog streamlit tensorflow joblib cryptography reportlab requests python-evtx
    - name: Verify installed packages
      run: |
        python -m pip show streamlit || true
        python -m pip list --format=columns
    - name: Run tests
      run: |
        python -m pytest tests/ -v --tb=short