name: LogShield CI Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run tests
      run: |
        pytest tests/ -v -ra --tb=short > test_output.log 2>&1 || true
        cat test_output.log
        while IFS= read -r line; do
          if [[ "$line" == *"FAILED"* || "$line" == *"FAILURES"* || "$line" == *"ERROR"* || "$line" == *"short test summary"* || "$line" == *"passed"* || "$line" == *"failed"* || "$line" == *"ModuleNotFound"* || "$line" == *"ImportError"* || "$line" == *"AssertionError"* ]]; then
            echo "::error title=Pytest::$line"
          fi
        done < test_output.log
        python -c "import sys; c=open('test_output.log').read(); sys.exit(1 if ('FAILED' in c or 'ERRORS' in c or 'ERROR ' in c) else 0)"